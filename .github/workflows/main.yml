
name: Registration Form Workflow

on:
  push:
    branches: [master]
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check project files
        run: |
          test -f registration.html
          test -f registration.css
          test -f registration.js
          echo "All registration form files exist!"
