
name: Registration Form CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  check-registration:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check registration files
        run: |
          echo "Checking registration form files..."
          test -f registration.html
          test -f registration.css
          test -f registration.js
          echo "Registration form checks passed!"
